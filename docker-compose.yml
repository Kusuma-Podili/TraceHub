version: "3.8"

services:
  tracehub:
    build: .
    container_name: tracehub-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - tracehub-data:/app/data
    environment:
      - APP_ENV=production
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tracehub-data:
    driver: local
